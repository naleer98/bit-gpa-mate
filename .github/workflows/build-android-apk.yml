name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.json"
      - "service-worker.js"
      - "assets/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Sync latest web files into Android app
        run: bash android/sync-web.sh

      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace --info

      - name: Prepare APK file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BIT-GPA-Mate-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: BIT-GPA-Mate-Android-APK
          path: BIT-GPA-Mate-v1.0.apk
          if-no-files-found: error
