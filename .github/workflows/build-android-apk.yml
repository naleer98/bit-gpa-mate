name: Build Signed Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.json"
      - "service-worker.js"
      - "assets/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/bit-gpa-mate-release.jks
          test -s android/app/bit-gpa-mate-release.jks

      - name: Sync latest web files into Android app
        run: bash android/sync-web.sh

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: bit-gpa-mate-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare release files
        run: |
          mkdir -p release-files
          cp android/app/build/outputs/apk/release/app-release.apk release-files/BIT-GPA-Mate-v1.0.0.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-files/BIT-GPA-Mate-v1.0.0.aab
          sha256sum release-files/* > release-files/SHA256SUMS.txt

      - name: Remove temporary keystore
        if: always()
        run: rm -f android/app/bit-gpa-mate-release.jks

      - name: Upload signed release files
        uses: actions/upload-artifact@v6
        with:
          name: BIT-GPA-Mate-Signed-Release
          path: release-files/
          if-no-files-found: error
          retention-days: 30
